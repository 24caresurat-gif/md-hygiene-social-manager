name: Scheduled Publishing (Deprecated)

# Production scheduling is handled by production-scheduler.yml, which calls both
# the publisher and CRM task-due worker with the required deployment bypass.
# This manual-only workflow remains temporarily to direct operators to the owner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated:
    runs-on: ubuntu-latest
    steps:
      - name: Point to the single production scheduler
        run: |
          echo "::warning::This workflow is deprecated to prevent duplicate publishing-worker calls."
          echo "Use Actions -> Production Scheduler to run the secured publisher and CRM task-due worker."

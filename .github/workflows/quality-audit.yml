name: Quality Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: audit-anon-key
      SUPABASE_SERVICE_ROLE_KEY: audit-service-role-key
      CRON_SECRET: audit-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Diagnostic branch: resolve the exact dependency tree before installing,
      # audit the resolved tree, and export the lockfile/report as an artifact.
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - run: npm ci
      - name: Capture dependency audit (informational on diagnostic branch)
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:a.metadata, vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([name,v])=>[name,{severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via}]))},null,2))"
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-diagnostic
          path: |
            package-lock.json
            npm-audit-report.json
          if-no-files-found: warn
